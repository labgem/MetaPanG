name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.11
  - pip
  # non-pip dependencies; MetaPanG itself and its PyPI dependencies are
  # installed from source with pip in the image build
  - graph-tool >=2.98
  - metagraph
  - ppanggolin >=2.3.1
  - procps-ng  # provides `ps`, required for Nextflow task metrics
