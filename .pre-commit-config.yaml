default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: pixi run -e dev ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: pixi run -e dev ruff format --check
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: pixi run -e dev pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: version-consistency
        name: version consistency (__version__ == pixi.toml)
        entry: python3 scripts/check_version.py
        language: system
        files: ^(metapang/__init__\.py|pixi\.toml)$
        pass_filenames: false
