name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # linux-64
          - os: ubuntu-24.04-arm   # linux-aarch64
          - os: macos-15-intel     # osx-64 (Intel)
          - os: macos-14           # osx-arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: default
          locked: true
          cache: true

      - name: Show versions
        run: pixi run -e default python -c "import metapang; print('metapang', metapang.__version__, metapang.__commit__)"

      - name: Run tests
        if: matrix.os != 'ubuntu-24.04-arm'
        run: pixi run -e default python -m pytest

      - name: Diagnose
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          ulimit -c unlimited
          py=$(pixi run -e default python -c "import sys; print(sys.executable)")
          echo "python: $py  ($(pixi run -e default python -c 'import sys;print(sys.version)'))"
          pixi run -e default python -c "import sourmash; print('sourmash', sourmash.__version__)"

          echo "== backtrace =="
          rm -f /tmp/core.*
          pixi run -e default python -c "import sourmash"; echo "  import sourmash -> exit $?"
          core=$(ls -t /tmp/core.* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            gdb -batch -ex "bt" -ex "thread apply all bt" "$py" "$core" 2>&1 | head -120
          else
            echo "no core file (core_pattern=$(cat /proc/sys/kernel/core_pattern))"
          fi

          echo "== sourmash version =="
          for V in 4.8.14 4.9.0 4.9.1 4.9.2 4.9.3 4.9.4; do
            rm -rf /tmp/smv
            python3 -m venv /tmp/smv
            /tmp/smv/bin/pip install -q "sourmash==$V" >/dev/null 2>&1 || { echo "  $V -> install failed"; continue; }
            /tmp/smv/bin/python -c "import sourmash"
            echo "  sourmash $V -> exit $?"
          done
