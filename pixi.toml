[workspace]
name = "metapang"
version = "0.1.0"
description = "Strain-level metagenomic profiling against pangenome graphs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "metapang"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
python = "3.12.*"
setuptools = "*"

[package.run-dependencies]
python = "3.12.*"
click = ">=8.1.8"
loguru = ">=0.7.3"
ppanggolin = ">=2.3.1"
pyfastx = ">=2.2.0"
pygithub = ">=2.6.1"
rich = ">=13.9.4"
rich-click = ">=1.8.6"
semver = ">=3.0.4"
sourmash = ">=4.9.4"
pytables = ">=3.10.1"
msgspec = ">=0.19.0"
tomli-w = ">=1.2.0"
jsonschema = ">=4.24.0"
gb-io = ">=0.3.6"
httpx = ">=0.28.1"
scipy = ">=1.15.3"
numpy = ">=1.26,<2"
pandas = ">=2.2.0"
graph-tool = ">=2.98"

[feature.app.dependencies]
python = "3.12.*"
graph-tool = ">=2.98"
numpy = ">=1.26,<2"
sourmash = ">=4.9.4,<5"
pytest = "*"

[feature.app.pypi-dependencies]
metapang = { path = ".", editable = true }

[feature.app.activation.env]
PATH = "$PATH:$PIXI_PROJECT_ROOT/.pixi/envs/metagraph/bin"

[feature.mg.dependencies]
metagraph = ">=0.5.1"

[feature.dev.dependencies]
pre-commit = ">=4.1.0"
ruff = ">=0.16"
pyright = ">=1.1.390"
ipython = "*"
viztracer = ">=1.1.1"

[feature.dev.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "pyright"
check = { depends-on = ["format-check", "lint", "typecheck"] }
install-hooks = "pre-commit install && ln -sf ../../scripts/git-pre-push .git/hooks/pre-push"

[feature.doc.dependencies]
sphinx = ">=8.1.3"
furo = ">=2024.8.6"
myst-parser = ">=4.0.1"
sphinx-copybutton = ">=0.5.2"

[feature.doc.tasks]
docs = "sphinx-build -b html docs docs/_build/html"

[environments]
default = ["app"]
metagraph = ["mg"]
dev = ["app", "dev", "doc"]

[tasks]
setup = "pixi install -e default -e metagraph"
metapang = "metapang"
test = "pytest"
docker = 'docker build --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) -f packaging/docker/Dockerfile -t ghcr.io/labgem/metapang:$(grep -m1 "^version = " pixi.toml | grep -oE "[0-9]+(\.[0-9]+)+") -t ghcr.io/labgem/metapang:latest .'
